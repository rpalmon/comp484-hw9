<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mini Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navigation" aria-label="Main navigation">
            <ul>
                <li><a href="#date-display">Date Display</a></li>
                <li><a href="#conversion-and-validation">Conversion and Validation</a></li>
                <li><a href="#number-formatting-and-math-results">Number Formatting and Math Results</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="date-display" class="date-display">
            <h2>Date Display</h2>
            <div id="date-container" class="date-container">
                <!-- Date will be displayed here -->

            </div>
        </section>

        <section id="conversion-and-validation" class="conversion-and-validation">
            <h2>Conversion and Validation</h2>
            <div id="conversion-container" class="conversion-container">
                <!-- Conversion and validation results will be displayed here -->
                <div class="conversion-block">
                    <input type="text" id="conversion-input" placeholder="Enter a number" value="42">
                    <button id="convert-button">Convert to Number</button>
                    <p id="conversion-result">Result to be displayed</p>
                </div>
                <div class="conversion-block">
                    <input type="text" id="validation-input" placeholder="Enter a number" value="19.75">
                    <button id="validate-button">Convert to Number</button>
                    <p id="validation-result"></p>
                </div>
                <div class="conversion-block">
                    <input type="text" id="math-input" placeholder="Enter a string" value="hello">
                    <button id="math-button">Calculate</button>
                    <p id="math-result"></p>
                </div>
                <div class="conversion-block">
                    <input type="text" id="number-formatting-input" placeholder="Enter a number with a decimal" value="100">
                    <button id="format-button">Format</button>
                    <p id="number-formatting-result"></p>
                </div>
            </div>
        </section>

        <section id="number-formatting-and-math-results" class="number-formatting-and-math-results">
            <h2>Number Formatting and Math Results</h2>
            <div id="number-container" class="number-container">
                <!-- Number formatting and math results will be displayed here -->
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
